    function screenToWorld(sx, sy) {
      return {
        x: (sx - viewOffsetX) / viewScale,
        y: (sy - viewOffsetY) / viewScale
      };
    }

    function getScreenPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top,
        p: (e.pointerType === 'pen' && typeof e.pressure === 'number' && e.pressure > 0) ? e.pressure : null
      };
    }

    function getPointerPos(e) {
      const sp = getScreenPos(e);
      const wp = screenToWorld(sp.x, sp.y);
      return { x: wp.x, y: wp.y, p: sp.p };
    }

    function applyZoomAtScreenPoint(sx, sy, mode, customScale = null) {
      const wp = screenToWorld(sx, sy);
      let nextScale = customScale !== null
        ? customScale
        : (mode === 'in' ? (viewScale * 1.25) : (viewScale / 1.25));
      nextScale = Math.min(MAX_VIEW_SCALE, Math.max(MIN_VIEW_SCALE, nextScale));
      if (customScale === null && Math.abs(nextScale - 1.0) < 0.04) nextScale = 1.0;

      viewScale = nextScale;
      viewOffsetX = sx - wp.x * viewScale;
      viewOffsetY = sy - wp.y * viewScale;
      syncPageViewState();
      if (currentTool === 'eraser') updateEraserCursor();
      redraw();
    }

    canvas.addEventListener('wheel', (e) => {
      if (currentTool === 'zoom' || e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const sx = e.clientX - rect.left;
        const sy = e.clientY - rect.top;
        const factor = Math.exp(-e.deltaY * 0.002);
        applyZoomAtScreenPoint(sx, sy, null, viewScale * factor);
        scheduleSaveProgress(500);
      }
    }, { passive: false });

    function distToSegment(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const lenSq = dx * dx + dy * dy;
      if (lenSq < 1e-10) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
    }

    function segmentsIntersect(ax, ay, bx, by, cx, cy, dx, dy) {
      const ccw = (p1x, p1y, p2x, p2y, p3x, p3y) =>
        (p3y - p1y) * (p2x - p1x) > (p2y - p1y) * (p3x - p1x);
      const d1 = ccw(ax, ay, cx, cy, dx, dy);
      const d2 = ccw(bx, by, cx, cy, dx, dy);
      const d3 = ccw(ax, ay, bx, by, cx, cy);
      const d4 = ccw(ax, ay, bx, by, dx, dy);
      if (d1 !== d2 && d3 !== d4) return true;
      return (
        distToSegment(ax, ay, cx, cy, dx, dy) < 1e-6 ||
        distToSegment(bx, by, cx, cy, dx, dy) < 1e-6 ||
        distToSegment(cx, cy, ax, ay, bx, by) < 1e-6 ||
        distToSegment(dx, dy, ax, ay, bx, by) < 1e-6
      );
    }

    function segmentIntersectsRect(x1, y1, x2, y2, rx, ry, rw, rh) {
      const rx2 = rx + rw;
      const ry2 = ry + rh;
      if ((x1 >= rx && x1 <= rx2 && y1 >= ry && y1 <= ry2) ||
          (x2 >= rx && x2 <= rx2 && y2 >= ry && y2 <= ry2)) {
        return true;
      }
      return (
        segmentsIntersect(x1, y1, x2, y2, rx, ry, rx2, ry) ||
        segmentsIntersect(x1, y1, x2, y2, rx2, ry, rx2, ry2) ||
        segmentsIntersect(x1, y1, x2, y2, rx2, ry2, rx, ry2) ||
        segmentsIntersect(x1, y1, x2, y2, rx, ry2, rx, ry)
      );
    }

    function hitTestTextObject(pos) {
      for (let i = (texts || []).length - 1; i >= 0; i--) {
        const t = texts[i];
        measureTextObject(t);
        if (isPointInRotatedRect(pos.x, pos.y, t, 4 / viewScale)) return t;
      }
      return null;
    }

    function hitTestObject(pos) {
      const hitRadius = 18 / viewScale;
      for (let i = paths.length - 1; i >= 0; i--) {
        const p = paths[i];
        if (!p.points || p.points.length === 0) continue;
        if (p.rotation) bakePathRotation(p);
        const strokeHalfW = (p.type === 'highlighter' ? p.size * 2.5 : p.size) * 0.5;
        const threshold = Math.max(hitRadius, strokeHalfW);
        if (p.points.length === 1) {
          if (Math.hypot(p.points[0].x - pos.x, p.points[0].y - pos.y) <= threshold) {
            return { type: 'path', obj: p };
          }
        } else {
          for (let j = 0; j < p.points.length - 1; j++) {
            const a = p.points[j];
            const b = p.points[j + 1];
            if (distToSegment(pos.x, pos.y, a.x, a.y, b.x, b.y) <= threshold) {
              return { type: 'path', obj: p };
            }
          }
        }
      }
      const hitText = hitTestTextObject(pos);
      if (hitText) return { type: 'text', obj: hitText };
      for (let i = images.length - 1; i >= 0; i--) {
        const img = images[i];
        if (isPointInRotatedRect(pos.x, pos.y, img, 0)) return { type: 'image', obj: img };
      }
      return null;
    }

    function getRotationHandlePosition() {
      const invS = 1 / viewScale;
      const centerX = groupBounds.x + groupBounds.w / 2;
      const toolbarRect = mainToolbar.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();
      const toolbarLeft = toolbarRect.left - canvasRect.left;
      const toolbarRight = toolbarRect.right - canvasRect.left;
      const screenX = centerX * viewScale + viewOffsetX;
      let x = centerX;

      if (screenX >= toolbarLeft - 18 && screenX <= toolbarRight + 18) {
        const handleScreenX = document.body.classList.contains('toolbar-left')
          ? toolbarRight + 24
          : toolbarLeft - 24;
        x = (handleScreenX - viewOffsetX) * invS;
      }

      return { x, y: groupBounds.y - 26 * invS };
    }

    function hitTestHandle(pos) {
      if (!groupBounds) return null;
      const invS = 1 / viewScale;
      const rotationHandle = getRotationHandlePosition();
      const rotX = rotationHandle.x, rotY = rotationHandle.y;
      if (Math.hypot(pos.x - rotX, pos.y - rotY) < 18 * invS) return 'rotating';

      const swX = groupBounds.x, swY = groupBounds.y + groupBounds.h;
      if (Math.hypot(pos.x - swX, pos.y - swY) < 20 * invS) return 'resizing-sw';

      const nX = groupBounds.x + groupBounds.w / 2, nY = groupBounds.y;
      if (Math.hypot(pos.x - nX, pos.y - nY) < 18 * invS) return 'resizing-n';

      const sX = groupBounds.x + groupBounds.w / 2, sY = groupBounds.y + groupBounds.h;
      if (Math.hypot(pos.x - sX, pos.y - sY) < 18 * invS) return 'resizing-s';

      const wX = groupBounds.x, wY = groupBounds.y + groupBounds.h / 2;
      if (Math.hypot(pos.x - wX, pos.y - wY) < 18 * invS) return 'resizing-w';

      const eX = groupBounds.x + groupBounds.w, eY = groupBounds.y + groupBounds.h / 2;
      if (Math.hypot(pos.x - eX, pos.y - eY) < 18 * invS) return 'resizing-e';

      return null;
    }

    function updateSelectCursor(pos) {
      if (currentTool !== 'select' || interactionState) return;
      if (groupBounds) {
        const handle = hitTestHandle(pos);
        if (handle === 'rotating') { canvas.style.cursor = 'grab'; return; }
        if (handle === 'resizing-sw') { canvas.style.cursor = 'nesw-resize'; return; }
        if (handle === 'resizing-n' || handle === 'resizing-s') { canvas.style.cursor = 'ns-resize'; return; }
        if (handle === 'resizing-w' || handle === 'resizing-e') { canvas.style.cursor = 'ew-resize'; return; }
        if (pos.x >= groupBounds.x && pos.x <= groupBounds.x + groupBounds.w && pos.y >= groupBounds.y && pos.y <= groupBounds.y + groupBounds.h) {
          canvas.style.cursor = 'move';
          return;
        }
      }
      canvas.style.cursor = 'default';
    }

    function beginCanvasPan(sp) {
      isPanning = true;
      panMoved = false;
      panStartX = sp.x;
      panStartY = sp.y;
      panOrigOffsetX = viewOffsetX;
      panOrigOffsetY = viewOffsetY;
    }

    function startAction(e) {
      const sp = getScreenPos(e);

      if (currentTool === 'zoom' || spaceKeyPressed || e.button === 1) {
        beginCanvasPan(sp);
        if (spaceKeyPressed || e.button === 1) {
          canvas.style.cursor = 'grabbing';
        }
        return;
      }

      const pos = getPointerPos(e);
      if (currentTool === 'text') {
        if (isEditingText) commitInlineTextEditor(false);
        const hitText = hitTestTextObject(pos);
        openInlineTextEditor(hitText ? hitText.x : pos.x, hitText ? hitText.y : pos.y, hitText);
        return;
      }
      if (currentTool === 'select') {
        if (groupBounds) {
          const handle = hitTestHandle(pos);
          if (handle) {
            pendingHistorySnapshot = capturePageState();
            interactionState = handle;
            dragStartX = pos.x; dragStartY = pos.y;
            if (handle === 'rotating') {
              const centerX = groupBounds.x + groupBounds.w / 2;
              const centerY = groupBounds.y + groupBounds.h / 2;
              rotationStartAngle = Math.atan2(pos.y - centerY, pos.x - centerX);
            }
            prepareTransformBackup();
            if (handle === 'rotating') canvas.style.cursor = 'grabbing';
            else if (handle === 'resizing-sw') canvas.style.cursor = 'nesw-resize';
            else if (handle === 'resizing-n' || handle === 'resizing-s') canvas.style.cursor = 'ns-resize';
            else if (handle === 'resizing-w' || handle === 'resizing-e') canvas.style.cursor = 'ew-resize';
            objectMenu.classList.remove('show'); opacitySubPanel.classList.remove('show');
            return;
          }
          if (pos.x >= groupBounds.x && pos.x <= groupBounds.x + groupBounds.w && pos.y >= groupBounds.y && pos.y <= groupBounds.y + groupBounds.h) {
            pendingHistorySnapshot = capturePageState();
            interactionState = 'dragging';
            dragStartX = pos.x; dragStartY = pos.y;
            prepareTransformBackup();
            canvas.style.cursor = 'move';
            objectMenu.classList.remove('show'); opacitySubPanel.classList.remove('show');
            return;
          }
        }
        const hit = hitTestObject(pos);
        if (hit) {
          pendingHistorySnapshot = capturePageState();
          selectedPaths = hit.type === 'path' ? [hit.obj] : [];
          selectedImages = hit.type === 'image' ? [hit.obj] : [];
          selectedTexts = hit.type === 'text' ? [hit.obj] : [];

      }

      if (e.pointerType === 'touch') {
        activeCanvasTouches.delete(e.pointerId);
        if (isTwoFingerGesture) {
          if (activeCanvasTouches.size === 0) {
            isTwoFingerGesture = false;
            scheduleSaveProgress(400);
          }
          return;
        }
      }

      if (activePointerId !== null && e.pointerId !== activePointerId) return;
      clearTimeout(blankLongPressTimer);
      try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
      activePointerId = null;
      endAction(e);
    }

    canvas.addEventListener('pointerup', finishPointer);
    canvas.addEventListener('pointercancel', finishPointer);
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space' && spaceKeyPressed) {
        spaceKeyPressed = false;
        if (!isPanning) restoreDefaultCursorForCurrentTool();
      }
    });

    window.addEventListener('keydown', (e) => {
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;

      if (e.key === 'Escape' && eyedropperActive) {
        e.preventDefault();
        cancelEyedropper();
        return;
      }

      if (e.code === 'Space' && !e.repeat) {
        e.preventDefault();
        spaceKeyPressed = true;
        if (!isPanning && !isDrawing && !interactionState) {
          canvas.style.cursor = '';
          canvas.className = 'pan-grab-cursor';
        }
        return;
      }

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
        e.preventDefault();
        undoAction();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) {
        e.preventDefault();
        redoAction();
        return;
      }

      if (currentTool === 'select' && (selectedPaths.length > 0 || selectedImages.length > 0)) {
        if (e.key === 'Delete' || e.key === 'Backspace') {
          recordUndoStep();
          deleteSelected();
          saveProgress();
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') copySelected();
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'x') {
          recordUndoStep();
          copySelected();
          deleteSelected();
          saveProgress();
        }
      }
    });

    function bakePathRotation(p) {
      if (!p.rotation) return;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      p.points.forEach(pt => {
        if (pt.x < minX) minX = pt.x;
        if (pt.y < minY) minY = pt.y;
        if (pt.x > maxX) maxX = pt.x;
        if (pt.y > maxY) maxY = pt.y;
      });
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      const cos = Math.cos(p.rotation);
      const sin = Math.sin(p.rotation);
      p.points.forEach(pt => {
        const dx = pt.x - cx;
        const dy = pt.y - cy;
        pt.x = cx + dx * cos - dy * sin;
        pt.y = cy + dx * sin + dy * cos;
      });
      p.rotation = 0;
    }

    function intersectSegmentCircle(ax, ay, dx, dy, cx, cy, r) {
      const fx = ax - cx;
      const fy = ay - cy;
      const a = dx * dx + dy * dy;
      if (a < 1e-10) {
        return (fx * fx + fy * fy <= r * r) ? [0, 1] : null;
      }
      const b = 2 * (fx * dx + fy * dy);
      const c = fx * fx + fy * fy - r * r;
      const disc = b * b - 4 * a * c;
      if (disc < 0) return null;
      const sqrtDisc = Math.sqrt(disc);
      const t1 = (-b - sqrtDisc) / (2 * a);
      const t2 = (-b + sqrtDisc) / (2 * a);
      const enter = Math.max(0, t1);
      const exit = Math.min(1, t2);
      return enter <= exit ? [enter, exit] : null;
    }

    function intersectSegmentCapsule(ax, ay, bx, by, e1x, e1y, e2x, e2y, r) {
      const dx = bx - ax;
      const dy = by - ay;
      let enter = Infinity;
      let exit = -Infinity;
      let hit = false;

      const c1 = intersectSegmentCircle(ax, ay, dx, dy, e1x, e1y, r);
      if (c1) {
        enter = Math.min(enter, c1[0]);
        exit = Math.max(exit, c1[1]);
        hit = true;
      }

      const ux = e2x - e1x;
      const uy = e2y - e1y;
      const lenSq = ux * ux + uy * uy;

      if (lenSq > 1e-8) {
        const c2 = intersectSegmentCircle(ax, ay, dx, dy, e2x, e2y, r);
        if (c2) {
          enter = Math.min(enter, c2[0]);
          exit = Math.max(exit, c2[1]);
          hit = true;
        }

        const len = Math.sqrt(lenSq);
        const invLen = 1 / len;
        const tx = ux * invLen;
        const ty = uy * invLen;
        const nx = -ty;
        const ny = tx;

        const relX = ax - e1x;
        const relY = ay - e1y;

        const s0 = relX * tx + relY * ty;
        const ds = dx * tx + dy * ty;
        const n0 = relX * nx + relY * ny;
        const dn = dx * nx + dy * ny;

        let tMin = 0;
        let tMax = 1;
        let rectValid = true;

        if (Math.abs(ds) < 1e-10) {
          if (s0 < 0 || s0 > len) rectValid = false;
        } else {
          let ta = -s0 / ds;
          let tb = (len - s0) / ds;
          if (ta > tb) { const tmp = ta; ta = tb; tb = tmp; }
          tMin = Math.max(tMin, ta);
          tMax = Math.min(tMax, tb);
          if (tMin > tMax) rectValid = false;
        }

        if (rectValid) {
          if (Math.abs(dn) < 1e-10) {
            if (n0 < -r || n0 > r) rectValid = false;
          } else {
            let ta = (-r - n0) / dn;
            let tb = (r - n0) / dn;
            if (ta > tb) { const tmp = ta; ta = tb; tb = tmp; }
            tMin = Math.max(tMin, ta);
            tMax = Math.min(tMax, tb);
            if (tMin > tMax) rectValid = false;
          }
        }

        if (rectValid) {
          enter = Math.min(enter, tMin);
          exit = Math.max(exit, tMax);
          hit = true;
        }
      }

      return hit ? [enter, exit] : null;
    }

    function interpolateStrokePoint(a, b, t) {
      if (t <= 1e-4) return { x: a.x, y: a.y, t: a.t, p: a.p };
      if (t >= 1 - 1e-4) return { x: b.x, y: b.y, t: b.t, p: b.p };
      return {
        x: a.x + (b.x - a.x) * t,
        y: a.y + (b.y - a.y) * t,
        t: (a.t !== undefined && b.t !== undefined) ? a.t + (b.t - a.t) * t : a.t,
        p: (a.p !== null && a.p !== undefined && b.p !== null && b.p !== undefined) ? a.p + (b.p - a.p) * t : a.p
      };
    }

    function pushPointDedup(seg, pt) {
      if (seg.length === 0) {
        seg.push(pt);
        return;
      }
      const prev = seg[seg.length - 1];
      if (Math.hypot(pt.x - prev.x, pt.y - prev.y) > 0.005) {
        seg.push(pt);
      }
    }

    function eraseAlongSegment(pos1, pos2) {
      const baseRadius = getNormalEraserRadius();
      const maxProbeRadius = baseRadius + 80;
      const capMinX = Math.min(pos1.x, pos2.x) - maxProbeRadius;
      const capMaxX = Math.max(pos1.x, pos2.x) + maxProbeRadius;
      const capMinY = Math.min(pos1.y, pos2.y) - maxProbeRadius;
      const capMaxY = Math.max(pos1.y, pos2.y) + maxProbeRadius;

      const newPaths = [];
      let changed = false;

      for (let idx = 0; idx < paths.length; idx++) {
        const p = paths[idx];
        if (!p.points || p.points.length === 0) continue;

        const strokeHalfW = (p.type === 'highlighter' ? p.size * 2.5 : p.size) * 0.5;
        const effectiveRadius = baseRadius + strokeHalfW * 0.85;

        let pMinX = Infinity, pMinY = Infinity, pMaxX = -Infinity, pMaxY = -Infinity;
        for (let k = 0; k < p.points.length; k++) {
          const pt = p.points[k];
          if (pt.x < pMinX) pMinX = pt.x;
          if (pt.y < pMinY) pMinY = pt.y;
          if (pt.x > pMaxX) pMaxX = pt.x;
          if (pt.y > pMaxY) pMaxY = pt.y;
        }

        if (p.rotation) {
          const cx = (pMinX + pMaxX) / 2;
          const cy = (pMinY + pMaxY) / 2;
          const halfDiag = Math.hypot(pMaxX - pMinX, pMaxY - pMinY) / 2;
          if (cx + halfDiag < capMinX || cx - halfDiag > capMaxX || cy + halfDiag < capMinY || cy - halfDiag > capMaxY) {
            newPaths.push(p);
            continue;
          }
          bakePathRotation(p);
        } else {
          if (pMaxX < capMinX || pMinX > capMaxX || pMaxY < capMinY || pMinY > capMaxY) {
            newPaths.push(p);
            continue;
          }
        }

        if (p.points.length === 1) {
          const pt = p.points[0];
          const hit = intersectSegmentCapsule(pt.x, pt.y, pt.x, pt.y, pos1.x, pos1.y, pos2.x, pos2.y, effectiveRadius);
          if (hit) {
            changed = true;
          } else {
            newPaths.push(p);
          }
          continue;
        }

        let currentSegment = [];
        let segStartCut = !!p.noStartTaper;
        let pathModified = false;

        const flushSegment = (endCut) => {
          if (currentSegment.length > 0) {
            newPaths.push({
              type: p.type,
              color: p.color,
              size: p.size,
              opacity: p.opacity,
              rotation: 0,
              noStartTaper: segStartCut,
              noEndTaper: endCut,
              points: currentSegment
            });
            currentSegment = [];
          }
        };

        for (let i = 0; i < p.points.length - 1; i++) {
          const a = p.points[i];
          const b = p.points[i + 1];
          const hit = intersectSegmentCapsule(a.x, a.y, b.x, b.y, pos1.x, pos1.y, pos2.x, pos2.y, effectiveRadius);

          if (!hit) {
            pushPointDedup(currentSegment, { x: a.x, y: a.y, t: a.t, p: a.p });
            pushPointDedup(currentSegment, { x: b.x, y: b.y, t: b.t, p: b.p });
          } else {
            pathModified = true;
            changed = true;
            const [tEnter, tExit] = hit;
            if (tEnter > 1e-4) {
              pushPointDedup(currentSegment, { x: a.x, y: a.y, t: a.t, p: a.p });
              pushPointDedup(currentSegment, interpolateStrokePoint(a, b, tEnter));
            }
            flushSegment(true);
            segStartCut = true;
            if (tExit < 1 - 1e-4) {
              pushPointDedup(currentSegment, interpolateStrokePoint(a, b, tExit));
              pushPointDedup(currentSegment, { x: b.x, y: b.y, t: b.t, p: b.p });
            }
          }
        }

        if (!pathModified) {
          newPaths.push(p);
        } else {
          flushSegment(!!p.noEndTaper);
        }
      }

      if (changed) {
        paths = newPaths;
        pages[currentPageIndex].paths = paths;
        scheduleRedraw();
      }
    }

    function eraseObjectAt(pos) {
      const baseRadius = Math.max(20 / viewScale, parseInt(sizeRange.value) * 1.5);
      let changed = false;
      const pCount = paths.length;
      paths = paths.filter(p => {
        if (p.rotation) bakePathRotation(p);
        const strokeHalfW = (p.type === 'highlighter' ? p.size * 2.5 : p.size) * 0.5;
        const threshold = baseRadius + strokeHalfW * 0.5;
        if (p.points.length === 1) {
          return Math.hypot(p.points[0].x - pos.x, p.points[0].y - pos.y) > threshold;
        }
        for (let j = 0; j < p.points.length - 1; j++) {
          if (distToSegment(pos.x, pos.y, p.points[j].x, p.points[j].y, p.points[j + 1].x, p.points[j + 1].y) <= threshold) {
            return false;
          }
        }
        return true;
      });
      if (paths.length !== pCount) changed = true;
      const imgCount = images.length;
      images = images.filter(img => !isPointInRotatedRect(pos.x, pos.y, img, 0));
      if (images.length !== imgCount) changed = true;
      const textCount = texts.length;
      texts = texts.filter(t => !isPointInRotatedRect(pos.x, pos.y, t, 4 / viewScale));
      if (texts.length !== textCount) changed = true;
      if (changed) { pages[currentPageIndex].paths = paths; pages[currentPageIndex].images = images; pages[currentPageIndex].texts = texts; scheduleRedraw(); }
    }

    function isPointInPolygon(point, polygon) {
      let x = point.x, y = point.y, inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        let xi = polygon[i].x, yi = polygon[i].y, xj = polygon[j].x, yj = polygon[j].y;
        if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
      }
      return inside;
    }

    clearBtn.addEventListener('click', () => {
      if (paths.length > 0 || images.length > 0 || texts.length > 0) {
        recordUndoStep();
      }
      pages[currentPageIndex].paths = []; pages[currentPageIndex].images = []; pages[currentPageIndex].texts = [];
      paths = pages[currentPageIndex].paths; images = pages[currentPageIndex].images; texts = pages[currentPageIndex].texts;
      selectedPaths = []; selectedImages = []; selectedTexts = []; groupBounds = null; origGroupBounds = null;
      topRightMenuWrapper.style.display = 'none'; objectMenu.classList.remove('show'); opacitySubPanel.classList.remove('show'); canvasMenu.style.display = 'none';
      resetViewTransform();
      redraw(); saveProgress();
    });

    function saveDrawingFile() {
      try {
        const payload = createProgressPayload();
        payload.format = 'fudy-whiteboard';
        payload.formatVersion = 1;
        const content = JSON.stringify(payload);

        if (window.whiteboardApp && typeof window.whiteboardApp.saveWhiteboardFile === 'function') {
          window.whiteboardApp.saveWhiteboardFile(content).catch(error => {
            console.error('白板檔案儲存失敗。', error);
            alert(`無法儲存白板檔案：${error.message || '未知錯誤。'}`);
          });
          return;
        }

        const file = new Blob([content], {
          type: 'application/vnd.fudy.whiteboard+json'
        });
        const url = URL.createObjectURL(file);
        const link = document.createElement('a');
        link.download = '數位白板.dwb';
        link.href = url;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      } catch (error) {
        console.error('白板檔案下載失敗。', error);
        alert(`無法下載白板檔案：${error.message || '未知錯誤。'}`);
      }
    }

    saveBtn.addEventListener('click', () => saveDrawingFile());

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        saveProgress();
      }
    });
    window.addEventListener('pagehide', () => {
      saveProgress();
    });
    window.addEventListener('beforeunload', () => {
      saveProgress();
    });

    initCanvas();
    saveBtn.disabled = true;
    progressReady = loadProgress();
    progressReady.then(() => {
      saveBtn.disabled = false;
    }).catch(error => {
      console.error('白板進度載入失敗。', error);
      alert('白板進度載入失敗，請重新整理後再試。');
    });
    startSparkleAnimation();
  </script>
</body>
</html>
